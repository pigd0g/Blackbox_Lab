name: Incubator Build (Windows)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.4.0-incubator.1)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run make

      - name: Create release with installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "${{ inputs.tag }}" \
            --notes "Incubator test build - Windows only. For testing, not for general use." \
            out/make/squirrel.windows/x64/*.exe \
            out/make/squirrel.windows/x64/*.nupkg \
            out/make/squirrel.windows/x64/RELEASES
